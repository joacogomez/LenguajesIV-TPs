<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ubicación</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="tarjeta">
    <h1>Ubicación</h1>

    <label for="nombre">Nombre Ubicación</label>
    <input type="text" id="nombre" placeholder="Nombre Ubicacion">

    <label for="latitud">Latitud</label>
    <input type="text" id="latitud" placeholder="28.3537921">

    <label for="longitud">Longitud</label>
    <input type="text" id="longitud" placeholder="-81.5618197">

    <button onclick="abrirUbicacion()">Abrir Ubicación</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
